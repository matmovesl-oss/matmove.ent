name: Sync MatMove lockfile

on:
  push:
    branches:
      - fix/production-ride-redispatch
    paths:
      - "project/package.json"
      - ".github/workflows/sync-matmove-lockfile.yml"

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: project/package-lock.json
      - name: Regenerate the lockfile from package.json
        working-directory: project
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit the synchronized lockfile
        run: |
          if git diff --quiet -- project/package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/package-lock.json
          git commit -m "chore: synchronize Supabase dependency lockfile"
          git push origin "HEAD:${{ github.ref_name }}"
