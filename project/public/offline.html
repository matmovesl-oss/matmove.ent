<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1769e0">
  <title>MatMove is offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f9fc;color:#16263d;font-family:system-ui,-apple-system,sans-serif}
    main{width:min(100%,420px);padding:28px;border:1px solid #e3eaf2;border-radius:24px;background:#fff;text-align:center;box-shadow:0 16px 48px rgba(20,45,75,.08)}
    h1{font-size:22px;margin:0 0 10px}p{font-size:14px;line-height:1.6;color:#64748b}button{min-height:44px;padding:0 20px;border:0;border-radius:12px;background:#1769e0;color:white;font-weight:700}
  </style>
</head>
<body><main><h1>You're currently offline</h1><p>MatMove needs an internet connection to load your account and services. Your wallet, payments and private account information are not stored for offline access.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
